name: Build Windows installer

# Manual by default so it never runs unasked, plus on a v* tag for real releases.
# This is the build that does not have to happen on your machine.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    # whisper.cpp compiles for the machine it is built on. GitHub runners have AVX-512,
    # which most church hardware does not, and the result died with an illegal
    # instruction (0xC000001D) on a Kaby Lake laptop the moment transcription started.
    # Build for a fixed floor instead: AVX2/FMA/F16C, i.e. Haswell (2013) and later.
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      GGML_AVX512: "OFF"
      GGML_AVX512_VBMI: "OFF"
      GGML_AVX512_VNNI: "OFF"
      GGML_AVX_VNNI: "OFF"
      # In a release build the `cmake` crate replaces CMake's release flags with its own,
      # which carry no optimization switch, so whisper.cpp was compiled unoptimized:
      # ~7x slower than a debug build of the same app. whisper-rs-sys forwards CMAKE_*
      # variables, and the crate leaves a flag alone once it is defined. Dash form, so
      # no shell mistakes "/O2" for a path.
      CMAKE_C_FLAGS_RELEASE: "-O2 -Ob2 -DNDEBUG"
      CMAKE_CXX_FLAGS_RELEASE: "-O2 -Ob2 -DNDEBUG"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Without this every run recompiles whisper.cpp from source.
      # whisper-rs-sys does not declare rerun-if-env-changed for GGML_* or CMAKE_*, so a
      # restored cache would silently keep the previous build. Bump this key whenever the
      # flags above change, or the fix will not take effect.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ggml-avx2-floor-o2-v2

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: bible-show-pro-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
