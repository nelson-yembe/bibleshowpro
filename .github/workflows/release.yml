name: Build Windows installer

# Manual by default so it never runs unasked, plus on a v* tag for real releases.
# This is the build that does not have to happen on your machine.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    # whisper.cpp compiles for the machine it is built on. GitHub runners have AVX-512,
    # which most church hardware does not, and the result died with an illegal
    # instruction (0xC000001D) on a Kaby Lake laptop the moment transcription started.
    # Build for a fixed floor instead: AVX2/FMA/F16C, i.e. Haswell (2013) and later.
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
      GGML_AVX512: "OFF"
      GGML_AVX512_VBMI: "OFF"
      GGML_AVX512_VNNI: "OFF"
      GGML_AVX_VNNI: "OFF"
      # In a release build the `cmake` crate replaces CMake's release flags with its own,
      # which carry no optimization switch, so whisper.cpp was compiled unoptimized:
      # ~7x slower than a debug build of the same app. whisper-rs-sys forwards CMAKE_*
      # variables, and the crate leaves a flag alone once it is defined. Dash form, so
      # no shell mistakes "/O2" for a path.
      CMAKE_C_FLAGS_RELEASE: "-O2 -Ob2 -DNDEBUG"
      CMAKE_CXX_FLAGS_RELEASE: "-O2 -Ob2 -DNDEBUG"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Without this every run recompiles whisper.cpp from source.
      # whisper-rs-sys does not declare rerun-if-env-changed for GGML_* or CMAKE_*, so a
      # restored cache would silently keep the previous build. Bump this key whenever the
      # flags above change, or the fix will not take effect.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ggml-avx2-floor-o2-v2

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri:build

      # The installer is only uploaded if the built app transcribes a known clip correctly
      # and fast enough. An unoptimized whisper.cpp takes 7-9x longer, well past the limit.
      - name: Cache benchmark model
        uses: actions/cache@v4
        with:
          path: ~/whisper-models
          key: ggml-base.en-a03779c8

      - name: Benchmark the offline engine
        shell: pwsh
        run: |
          $model = Join-Path $HOME "whisper-models/ggml-base.en.bin"
          if (-not (Test-Path $model)) {
            New-Item -ItemType Directory -Force (Split-Path $model) | Out-Null
            Invoke-WebRequest https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin -OutFile $model
          }
          if ((Get-FileHash $model -Algorithm SHA256).Hash -ne "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002") {
            Remove-Item $model
            throw "The benchmark model download is corrupt."
          }
          ./scripts/whisper-benchmark.ps1 `
            -Exe src-tauri/target/release/bible-show-pro.exe `
            -Model $model `
            -SpeechDetector src-tauri/resources/ggml-silero-v6.2.0.bin `
            -MaxSeconds 8

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: bible-show-pro-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
