<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Remote control</title>
<style>
  :root { --bg: #0b0d12; --fg: #eef1f6; --muted: #8b93a3; --panel: #151925; --line: #2a3040; --red: #d93a3f; --blue: #2f6fe0; --pick: rgba(47, 111, 224, 0.22); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  body { min-height: 100vh; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  h1 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 4px 0 14px; }
  h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 26px 0 10px; }
  form { display: grid; gap: 10px; margin-top: 18vh; }
  #pin { font: 600 28px/1 ui-monospace, Consolas, monospace; letter-spacing: 0.3em; text-align: center; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  button { font: 600 17px system-ui, sans-serif; color: #fff; border: 0; border-radius: 14px; padding: 18px 12px; background: var(--panel); }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.45; }
  .primary { background: var(--blue); }
  .live { background: var(--red); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wide { grid-column: 1 / -1; }
  .now { background: var(--panel); border-radius: 14px; padding: 14px; margin-bottom: 14px; min-height: 64px; }
  .now small { color: var(--muted); display: block; margin-bottom: 4px; }
  .message { min-height: 22px; color: #f2c14e; font-size: 14px; text-align: center; margin-top: 10px; }
  .search { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .search input, .search select { font: 16px system-ui, sans-serif; padding: 13px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); min-width: 0; }
  .search button { grid-column: 1 / -1; padding: 14px; }
  .title { font-weight: 700; margin: 14px 0 6px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  ol { list-style: none; margin: 0; padding: 0 0 150px; }
  li { padding: 10px 10px; border-radius: 10px; font: 16px/1.45 Georgia, serif; }
  li b { font: 700 12px system-ui, sans-serif; color: #f2c14e; margin-right: 6px; }
  li small { display: block; font: 12px system-ui, sans-serif; color: var(--muted); margin-bottom: 2px; }
  li.on { background: var(--pick); }
  .pickbar { position: fixed; left: 0; right: 0; bottom: 0; background: #10141d; border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .pickbar .inner { max-width: 528px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr 1fr auto; gap: 8px; align-items: center; }
  .pickbar .label { grid-column: 1 / -1; font-weight: 700; font-size: 15px; }
  .pickbar button { padding: 14px 10px; font-size: 16px; }
  .pickbar .step { padding: 14px 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Bible Show Pro · Remote</h1>

<form id="signin">
  <label for="pin">Enter the PIN shown in the app</label>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required>
  <button class="primary" type="submit">Connect</button>
</form>

<section id="controls" hidden>
  <div class="now"><small>On screen</small><div id="now">—</div></div>
  <div class="grid">
    <button data-action="prev">◀ Previous verse</button>
    <button data-action="next">Next verse ▶</button>
    <button class="live wide" data-action="go-live">Take preview live</button>
    <button class="primary wide" data-action="accept-next">Show next suggestion</button>
    <button data-action="blackout">Black screen</button>
    <button data-action="clear">Clear</button>
  </div>

  <h2>Scripture</h2>
  <form class="search" id="find" style="margin:0">
    <input id="query" placeholder="John 3:16, Psaume 23, or words" autocomplete="off" enterkeyhint="search">
    <select id="translation" aria-label="Translation"></select>
    <button type="submit">Find</button>
  </form>
  <p class="title" id="title" hidden></p>
  <p class="hint" id="hint" hidden></p>
  <ol id="verses"></ol>

  <button id="signout" style="margin-top:4px;width:100%;background:transparent;color:var(--muted)">Sign out</button>
</section>

<div class="pickbar" id="pickbar" hidden>
  <div class="inner">
    <div class="label" id="picked"></div>
    <button class="step" id="back" aria-label="Previous verse">◀</button>
    <button class="primary" id="preview">Preview</button>
    <button class="live" id="show">Show live</button>
    <button class="step" id="forward" aria-label="Next verse">▶</button>
  </div>
</div>

<p class="message" id="message"></p>

<script>
  const $ = (id) => document.getElementById(id);
  const message = $("message");
  let pin = "";
  try { pin = sessionStorage.getItem("bsp-pin") || ""; } catch {}

  async function call(path, body) {
    const response = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin, ...body }),
    });
    if (response.status === 401) { signOut("Wrong PIN."); return null; }
    if (response.status === 429) { signOut("Too many wrong PINs. Wait a minute, then try again."); return null; }
    if (!response.ok) {
      const text = await response.text();
      message.textContent = text || "The app did not respond. Is it still open?";
      return null;
    }
    message.textContent = "";
    return response.status === 204 ? true : response.json();
  }

  const send = (action) => call("/api/command", { action });

  function signOut(text) {
    pin = "";
    try { sessionStorage.removeItem("bsp-pin"); } catch {}
    $("controls").hidden = true;
    $("pickbar").hidden = true;
    $("signin").hidden = false;
    message.textContent = text || "";
  }

  async function showControls() {
    $("signin").hidden = true;
    $("controls").hidden = false;
    await loadTranslations();
  }

  $("signin").onsubmit = async (event) => {
    event.preventDefault();
    pin = $("pin").value.trim();
    if (await send("check")) {
      try { sessionStorage.setItem("bsp-pin", pin); } catch {}
      showControls();
    }
  };
  $("signout").onclick = () => signOut();
  for (const button of document.querySelectorAll("[data-action]")) {
    button.onclick = () => {
      if (navigator.vibrate) navigator.vibrate(15);
      send(button.dataset.action);
    };
  }

  // ---- Scripture ----
  let translation = "";
  let results = { verses: [], fromSearch: false };
  let pick = null; // { bookNumber, book, chapter, start, end }
  let lastShown = null; // "preview" | "live", so stepping keeps the screen following

  async function loadTranslations() {
    const list = await call("/api/translations", {});
    if (!list) return;
    let saved = "";
    try { saved = localStorage.getItem("bsp-remote-translation") || ""; } catch {}
    const select = $("translation");
    select.replaceChildren(...list.map((t) => {
      const option = document.createElement("option");
      option.value = t.id;
      option.textContent = t.abbreviation;
      option.title = t.name;
      return option;
    }));
    translation = list.some((t) => t.id === saved) ? saved : (list[0] && list[0].id) || "";
    select.value = translation;
  }

  $("translation").onchange = async (event) => {
    translation = event.target.value;
    try { localStorage.setItem("bsp-remote-translation", translation); } catch {}
    // Same chapter, other wording.
    if (pick && !results.fromSearch) await openChapter(pick.bookNumber, pick.chapter, pick);
  };

  $("find").onsubmit = async (event) => {
    event.preventDefault();
    const query = $("query").value.trim();
    if (!query) return;
    $("query").blur();
    const found = await call("/api/scripture", { translation, query });
    if (!found) return;
    setResults(found);
    if (found.selected && found.verses[0]) {
      const v = found.verses[0];
      choose({ bookNumber: v.bookNumber, book: v.book, chapter: v.chapter, start: found.selected[0], end: found.selected[1] });
    } else {
      choose(null);
    }
  };

  async function openChapter(bookNumber, chapter, keep) {
    const found = await call("/api/scripture", { translation, bookNumber, chapter });
    if (!found) return;
    setResults(found);
    const first = found.verses[0];
    choose(keep && first ? { ...keep, book: first.book } : null);
  }

  function setResults(found) {
    results = found;
    $("title").hidden = false;
    $("title").textContent = found.verses.length ? found.title : `Nothing found for “${found.title}”`;
    $("hint").hidden = found.verses.length === 0;
    $("hint").textContent = found.fromSearch
      ? "Tap a verse to open its chapter."
      : "Tap a verse; tap another to choose the verses between.";
    lastShown = null;
  }

  function choose(next) {
    pick = next;
    const list = $("verses");
    list.replaceChildren(...results.verses.map((v) => {
      const item = document.createElement("li");
      const on = pick && !results.fromSearch && v.bookNumber === pick.bookNumber && v.chapter === pick.chapter && v.verse >= pick.start && v.verse <= pick.end;
      if (on) item.className = "on";
      if (results.fromSearch) {
        const where = document.createElement("small");
        where.textContent = `${v.book} ${v.chapter}:${v.verse}`;
        item.append(where);
      } else {
        const number = document.createElement("b");
        number.textContent = String(v.verse);
        item.append(number);
      }
      item.append(document.createTextNode(v.text));
      item.onclick = () => tap(v);
      return item;
    }));
    $("pickbar").hidden = !pick;
    if (pick) {
      const range = pick.start === pick.end ? `${pick.start}` : `${pick.start}–${pick.end}`;
      const abbr = $("translation").selectedOptions[0]?.textContent || "";
      $("picked").textContent = `${pick.book} ${pick.chapter}:${range} · ${abbr}`;
      const first = list.querySelector("li.on");
      if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }

  function tap(v) {
    if (results.fromSearch) {
      openChapter(v.bookNumber, v.chapter, { bookNumber: v.bookNumber, book: v.book, chapter: v.chapter, start: v.verse, end: v.verse });
      return;
    }
    lastShown = null;
    if (pick && pick.start === pick.end && pick.start !== v.verse && pick.chapter === v.chapter) {
      // A second tap marks the other end of the passage, up to 20 verses.
      const start = Math.min(pick.start, v.verse);
      const end = Math.min(Math.max(pick.start, v.verse), start + 19);
      choose({ ...pick, start, end });
      return;
    }
    choose({ bookNumber: v.bookNumber, book: v.book, chapter: v.chapter, start: v.verse, end: v.verse });
  }

  async function show(mode) {
    if (!pick) return;
    if (navigator.vibrate) navigator.vibrate(15);
    const ok = await call("/api/show", {
      live: mode === "live",
      translation,
      bookNumber: pick.bookNumber,
      chapter: pick.chapter,
      start: pick.start,
      end: pick.end,
    });
    if (ok) lastShown = mode;
  }

  $("preview").onclick = () => show("preview");
  $("show").onclick = () => show("live");

  // Step the chosen verses through the chapter; once shown, the screen follows.
  function step(delta) {
    if (!pick || results.fromSearch) return;
    const size = pick.end - pick.start + 1;
    const last = results.verses.length ? results.verses[results.verses.length - 1].verse : pick.end;
    const start = Math.max(1, Math.min(pick.start + delta * size, last - size + 1));
    if (start === pick.start) return;
    const mode = lastShown;
    choose({ ...pick, start, end: start + size - 1 });
    if (mode) show(mode);
  }
  $("back").onclick = () => step(-1);
  $("forward").onclick = () => step(1);

  if (pin) send("check").then((ok) => ok && showControls());

  const now = $("now");
  const events = new EventSource("/events");
  events.onmessage = (event) => {
    const view = JSON.parse(event.data).view;
    if (!view || view.kind === "idle") now.textContent = "Nothing on screen";
    else now.textContent = [view.reference || view.title, view.translation].filter(Boolean).join(" · ") || "On screen";
  };
  events.onerror = () => { now.textContent = "Reconnecting…"; };
</script>
</body>
</html>
