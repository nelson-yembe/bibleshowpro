<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Remote control</title>
<style>
  :root { --bg: #0b0d12; --fg: #eef1f6; --muted: #8b93a3; --panel: #151925; --red: #d93a3f; --blue: #2f6fe0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  body { min-height: 100vh; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  h1 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 4px 0 14px; }
  form { display: grid; gap: 10px; margin-top: 18vh; }
  input { font: 600 28px/1 ui-monospace, Consolas, monospace; letter-spacing: 0.3em; text-align: center; padding: 14px; border-radius: 12px; border: 1px solid #2a3040; background: var(--panel); color: var(--fg); }
  button { font: 600 17px system-ui, sans-serif; color: #fff; border: 0; border-radius: 14px; padding: 18px 12px; background: var(--panel); }
  button:active { transform: scale(0.98); }
  .primary { background: var(--blue); }
  .live { background: var(--red); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wide { grid-column: 1 / -1; }
  .now { background: var(--panel); border-radius: 14px; padding: 14px; margin-bottom: 14px; min-height: 64px; }
  .now small { color: var(--muted); display: block; margin-bottom: 4px; }
  .message { min-height: 22px; color: #f2c14e; font-size: 14px; text-align: center; margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Bible Show Pro · Remote</h1>

<form id="signin">
  <label for="pin">Enter the PIN shown in the app</label>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required>
  <button class="primary" type="submit">Connect</button>
</form>

<section id="controls" hidden>
  <div class="now"><small>On screen</small><div id="now">—</div></div>
  <div class="grid">
    <button data-action="prev">◀ Previous verse</button>
    <button data-action="next">Next verse ▶</button>
    <button class="live wide" data-action="go-live">Take preview live</button>
    <button class="primary wide" data-action="accept-next">Show next suggestion</button>
    <button data-action="blackout">Black screen</button>
    <button data-action="clear">Clear</button>
  </div>
  <button id="signout" class="wide" style="margin-top:14px;width:100%;background:transparent;color:var(--muted)">Sign out</button>
</section>

<p class="message" id="message"></p>

<script>
  const message = document.getElementById("message");
  const signin = document.getElementById("signin");
  const controls = document.getElementById("controls");
  let pin = "";
  try { pin = sessionStorage.getItem("bsp-pin") || ""; } catch {}

  async function send(action) {
    const response = await fetch("/api/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin, action }),
    });
    if (response.status === 401) { signOut("Wrong PIN."); return false; }
    if (response.status === 429) { signOut("Too many wrong PINs. Wait a minute, then try again."); return false; }
    if (!response.ok) { message.textContent = "The app did not respond. Is it still open?"; return false; }
    message.textContent = "";
    return true;
  }

  function signOut(text) {
    pin = "";
    try { sessionStorage.removeItem("bsp-pin"); } catch {}
    controls.hidden = true;
    signin.hidden = false;
    message.textContent = text || "";
  }

  async function showControls() {
    signin.hidden = true;
    controls.hidden = false;
  }

  signin.onsubmit = async (event) => {
    event.preventDefault();
    pin = document.getElementById("pin").value.trim();
    if (await send("check")) {
      try { sessionStorage.setItem("bsp-pin", pin); } catch {}
      showControls();
    }
  };
  document.getElementById("signout").onclick = () => signOut();
  for (const button of document.querySelectorAll("[data-action]")) {
    button.onclick = () => {
      if (navigator.vibrate) navigator.vibrate(15);
      send(button.dataset.action);
    };
  }
  if (pin) send("check").then((ok) => ok && showControls());

  const now = document.getElementById("now");
  const events = new EventSource("/events");
  events.onmessage = (event) => {
    const view = JSON.parse(event.data).view;
    if (!view || view.kind === "idle") now.textContent = "Nothing on screen";
    else now.textContent = [view.reference || view.title, view.translation].filter(Boolean).join(" · ") || "On screen";
  };
  events.onerror = () => { now.textContent = "Reconnecting…"; };
</script>
</body>
</html>
